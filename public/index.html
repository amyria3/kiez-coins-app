<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: Die App reicht bis unter Statusleiste und Home-Balken, die Abstände kommen aus useSafeAreaInsets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>KiezCoins</title>
    <!-- Web-App fürs iPhone: „Zum Home-Bildschirm“ in Safari startet KiezCoins ohne Browserleiste. -->
    <!-- Die Web-App liegt an der Wurzel von app.kiezcoins.de, die Pfade beginnen deshalb mit /. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KiezCoins" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#232326" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Style-Reset von react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #232326;
        color-scheme: dark;
        /* Kein Mitfedern der ganzen Seite, wenn man an einer Stelle zieht, die nicht scrollt (Daria, 2026-11-14) */
        overscroll-behavior: none;
      }
      /* Offene Tastatur: Die Seite wird so hoch wie der sichtbare Teil darüber. --keyboard-inset setzt
         src/components/Keyboard.tsx aus window.visualViewport (Daria, 2026-11-11). */
      body {
        height: calc(100% - var(--keyboard-inset, 0px));
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* Vom Browser ausgefüllte Felder (Passwort, E-Mail): dunkle Fläche statt Gelb oder Hellblau, heller Text */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: #fff8ed;
        caret-color: #fff8ed;
        -webkit-box-shadow: 0 0 0 1000px #303034 inset;
        box-shadow: 0 0 0 1000px #303034 inset;
        transition: background-color 9999s ease-out 0s;
      }
      /* Langes Drücken auf ein Foto öffnet den Post, nicht Safaris Menü „Sichern, Teilen“ */
      img {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Aktive Farbe wie in der App (color/accent/primary) statt Browser-Blau */
      :root {
        accent-color: #8f90fa;
      }
      /* Eingabefelder zeigen den Fokus über ihren eigenen Rahmen, ohne Browser-Umrandung */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* Cursor in der App-Farbe (color/accent/primary) statt Browser-Blau, wie selectionColor in der App */
      input,
      textarea {
        caret-color: #8f90fa;
        /* Luft, falls Safari das Feld beim Antippen selbst ins Bild schiebt. Danach rückt revealFocused (Nudge.tsx) es genau hin. */
        scroll-margin: 24px;
      }
      /* Tastatur-Fokus auf Buttons und Links in der App-Farbe */
      :focus-visible {
        outline: 2px solid #8f90fa;
        outline-offset: 2px;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        /* Breitere Fenster zeigen die App mittig wie auf einem Telefon (WEB_MAX_WIDTH in src/theme/layout.ts) */
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }
      /* App auf dem iPhone-Home-Bildschirm: Mit durchsichtiger Statusleiste rechnet iOS die Höhe 100 % ohne die Statusleiste.
         Die App endete dadurch um diese Höhe zu früh, und die Tab-Leiste saß zu weit oben (Daria, 2026-10-23). */
      @media (display-mode: standalone) {
        html {
          overflow: hidden;
        }
        body {
          height: calc(100% + env(safe-area-inset-top) - var(--keyboard-inset, 0px));
        }
      }
      /* Öffentliche Seiten in voller Breite (Daria, 2026-11-28): die Digitale Visitenkarte für Gäste. Die Klasse setzt
         public/start.js vor dem Laden, danach useWideWeb in src/theme/layout.ts (WEB_WIDE_MAX_WIDTH). */
      html.kc-breit #root {
        max-width: none;
        box-shadow: none;
      }
      /* Seitenränder neben der App im Desktop-Browser */
      @media (min-width: 481px) {
        body {
          background-color: #1a1a1c;
        }
        #root {
          background-color: #232326;
          box-shadow: 0 0 0 1px rgba(255, 240, 225, 0.08);
        }
      }
      /* Desktop-Fassung ab 680 px (Daria, 2026-11-28): volle Fensterbreite, links die Seitenleiste, der Inhalt in 620 px
         Lesebreite (DESKTOP_FROM in src/theme/layout.ts, Rahmen in src/components/DesktopNav.tsx) */
      @media (min-width: 680px) {
        #root,
        html.kc-breit #root {
          max-width: none;
          box-shadow: none;
        }
      }
      /* Zahnräder, bevor das Skript läuft: gleiche Größe und Lage wie im Startbildschirm (StartKater.tsx).
         Beim Neuladen nach einem Look-Wechsel drehen sie so sofort (Daria, 24.10.2026). */
      #boot {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom) + 32px);
        width: min(200px, 22vh);
        transform: translateX(-50%);
        z-index: 20;
        pointer-events: none;
      }
      #boot img {
        display: block;
        width: 100%;
        height: auto;
      }
      /* Platz in der Mitte über den Zahnrädern (StartKater.tsx); vor dem Laden leer, damit der Kater reinrollen kann */
      #boot-moment {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: calc(env(safe-area-inset-bottom) + 32px + min(200px, 22vh) + 24px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        pointer-events: none;
        color: #fff8ed;
        font: 18px/24px -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      }
      #boot-moment i {
        font-style: normal;
        animation: boot-dot2 1.2s steps(1) infinite;
      }
      #boot-moment i:first-of-type {
        animation: none;
      }
      #boot-moment i:last-of-type {
        animation-name: boot-dot3;
      }
      @keyframes boot-dot2 {
        0% { opacity: 0; }
        33% { opacity: 1; }
      }
      @keyframes boot-dot3 {
        0% { opacity: 0; }
        66% { opacity: 1; }
      }
    </style>
  </head>

  <body>
    <noscript>KiezCoins braucht JavaScript.</noscript>
    <div id="boot" aria-hidden="true"><img src="/gears.svg" alt="" /></div>
    <!-- Vor dem Laden nur die Zahnräder; danach rollt der Kater ins Bild und die Buchstaben fallen dazu (StartKater.tsx, Daria, 2026-11-16) -->
    <div id="boot-moment" aria-hidden="true"></div>
    <div id="root"></div>
    <script src="/start.js"></script>
  </body>
</html>
