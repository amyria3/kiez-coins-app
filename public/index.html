<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: Die App reicht bis unter Statusleiste und Home-Balken, die Abstände kommen aus useSafeAreaInsets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Kiez Coins</title>
    <!-- Web-App fürs iPhone: „Zum Home-Bildschirm“ in Safari startet Kiez Coins ohne Browserleiste. -->
    <!-- Die Pfade beginnen mit /app/, passend zu experiments.baseUrl in app.json. -->
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kiez Coins" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1F2123" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Style-Reset von react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #1f2123;
        color-scheme: dark;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* Vom Browser ausgefüllte Felder (Passwort, E-Mail): dunkle Fläche statt Gelb oder Hellblau, heller Text */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: #f0f0f0;
        caret-color: #f0f0f0;
        -webkit-box-shadow: 0 0 0 1000px #2b2d31 inset;
        box-shadow: 0 0 0 1000px #2b2d31 inset;
        transition: background-color 9999s ease-out 0s;
      }
      /* Langes Drücken auf ein Foto öffnet den Post, nicht Safaris Menü „Sichern, Teilen“ */
      img {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Aktive Farbe wie in der App (color/accent/primary) statt Browser-Blau */
      :root {
        accent-color: #7e94ff;
      }
      /* Eingabefelder zeigen den Fokus über ihren eigenen Rahmen, ohne Browser-Umrandung */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* Tastatur-Fokus auf Buttons und Links in der App-Farbe */
      :focus-visible {
        outline: 2px solid #7e94ff;
        outline-offset: 2px;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        /* Breitere Fenster zeigen die App mittig wie auf einem Telefon (WEB_MAX_WIDTH in src/theme/layout.ts) */
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }
      /* App auf dem iPhone-Home-Bildschirm: Mit durchsichtiger Statusleiste rechnet iOS die Höhe 100 % ohne die Statusleiste.
         Die App endete dadurch um diese Höhe zu früh, und die Tab-Leiste saß zu weit oben (Daria, 2026-10-23). */
      @media (display-mode: standalone) {
        html {
          overflow: hidden;
        }
        body {
          height: calc(100% + env(safe-area-inset-top));
        }
      }
      /* Seitenränder neben der App im Desktop-Browser */
      @media (min-width: 481px) {
        body {
          background-color: #17181a;
        }
        #root {
          background-color: #1f2123;
          box-shadow: 0 0 0 1px rgba(240, 240, 240, 0.08);
        }
      }
    </style>
  </head>

  <body>
    <noscript>Kiez Coins braucht JavaScript.</noscript>
    <div id="root"></div>
    <script>
      // Safari kennt requestIdleCallback nicht. Expo Router ruft es an einer Stelle ohne Prüfung auf.
      if (!window.requestIdleCallback) {
        window.requestIdleCallback = function (cb) {
          return setTimeout(function () { cb({ didTimeout: false, timeRemaining: function () { return 0; } }); }, 1);
        };
        window.cancelIdleCallback = function (id) { clearTimeout(id); };
      }
      // Startet die App nicht, zeigt die Seite den Fehler statt eines schwarzen Bildschirms (Daria, 23.10.2026).
      (function () {
        var shown = false;
        function show(text) {
          var root = document.getElementById('root');
          if (shown || !root || root.innerText.trim()) return;
          shown = true;
          var box = document.createElement('div');
          box.setAttribute('style', 'position:fixed;inset:0;z-index:99;padding:64px 24px;background:#1f2123;color:#f0f0f0;font:15px/1.4 -apple-system,system-ui,sans-serif;overflow:auto');
          box.innerHTML = '<p style="font-size:22px;font-weight:600;margin:0 0 12px">Kiez Coins startet nicht</p>' +
            '<p style="margin:0 0 16px;color:#a0a0a0">Schick bitte einen Screenshot an den Support.</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;color:#ff7e8b;margin:0 0 24px"></pre>' +
            '<a href="/app/?look=kiez" style="display:inline-block;padding:12px 20px;border-radius:12px;background:#7e94ff;color:#1f2123;text-decoration:none;font-weight:600">Neu laden</a>';
          box.querySelector('pre').textContent = String(text).slice(0, 1200) + '\n\nStart: ' + (window.__kiezStart || 'Skript nicht gestartet') + '\n' + navigator.userAgent;
          document.body.appendChild(box);
          // Startet die App doch noch, verschwindet der Hinweis wieder
          var watch = setInterval(function () {
            if (root.innerText.trim()) { clearInterval(watch); box.remove(); }
          }, 1000);
        }
        window.addEventListener('error', function (e) {
          // Bilder, die nicht laden, sind kein Startproblem. Nur Skripte zählen.
          if (e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return;
          var msg = e.error && e.error.stack ? e.error.stack : (e.message || 'Skript nicht geladen: ' + ((e.target && e.target.src) || '?'));
          setTimeout(function () { show(msg); }, 1500);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          setTimeout(function () { show(r && r.stack ? r.stack : String(r)); }, 1500);
        });
        // Nach 12 Sekunden immer noch leer: Hinweis ohne Fehlertext
        setTimeout(function () { show('Nach 8 Sekunden ist noch nichts zu sehen.'); }, 8000);
      })();
    </script>
  </body>
</html>
